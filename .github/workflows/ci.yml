name: DjusovEngine CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-linux-and-windows:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build \
          libgl1-mesa-dev libglu1-mesa-dev \
          libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
          libglew-dev libglfw3-dev libglm-dev nlohmann-json3-dev mingw-w64

    - name: Configure CMake
      run: cmake -B build -G Ninja

    - name: Build All Targets
      run: cmake --build build

    - name: Verify Headless Export Test
      run: ./build/DjusovEngine --build-test

    - name: Verify Dedicated Server
      run: |
        ./build/djusov_runner --server 7777 &
        SERVER_PID=$!
        sleep 2
        kill $SERVER_PID
